server {
    listen 80;
    server_name subtitle.gcsfg.work;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name subtitle.gcsfg.work;

    ssl_certificate /etc/letsencrypt/live/subtitle.gcsfg.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/subtitle.gcsfg.work/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SubtitleSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;

    location ^~ /releases/ {
        alias /var/www/subtitle-releases/;
        autoindex off;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
